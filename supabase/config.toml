# Per-function Edge Function settings for `supabase functions deploy`.
# Without this, the CLI defaults every function to verify_jwt = true, which
# would break whop-webhook (Whop can't send a Supabase JWT — its Standard
# Webhooks signature is the authentication instead).

[functions.whop-webhook]
verify_jwt = false

[functions.whop-checkout]
verify_jwt = true

[functions.whop-affiliate]
verify_jwt = true

[functions.product-access]
verify_jwt = true

[functions.builder]
verify_jwt = true

[functions.discovery]
verify_jwt = true

[functions.discovery-analyze]
verify_jwt = true

[functions.discovery-interview]
verify_jwt = true

[functions.blueprint-generate]
verify_jwt = true
